name: Sync GitHub and Hugging Face

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-github-huggingface-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize main branches
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPOSITORY: https://huggingface.co/spaces/guoyafang615/stockai
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$HF_TOKEN" ]]; then
            echo "::error::Configure the HF_TOKEN Actions secret with write access to the Hugging Face Space."
            exit 1
          fi

          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "hf_user" ;;
            *Password*) printf '%s\n' "$HF_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --no-tags "$HF_REPOSITORY" main:refs/remotes/huggingface/main

          github_sha="$(git rev-parse refs/remotes/origin/main)"
          huggingface_sha="$(git rev-parse refs/remotes/huggingface/main)"

          if [[ "$github_sha" == "$huggingface_sha" ]]; then
            echo "GitHub and Hugging Face main branches are already synchronized at $github_sha."
          elif git merge-base --is-ancestor "$github_sha" "$huggingface_sha"; then
            if ! git diff --quiet "$github_sha" "$huggingface_sha" -- .github/workflows/; then
              echo "::error::Hugging Face changes modify GitHub Actions workflows. Review and merge those changes on GitHub."
              exit 1
            fi
            git push origin refs/remotes/huggingface/main:refs/heads/main
            echo "Fast-forwarded GitHub main to Hugging Face commit $huggingface_sha."
          elif git merge-base --is-ancestor "$huggingface_sha" "$github_sha"; then
            git push "$HF_REPOSITORY" refs/remotes/origin/main:refs/heads/main
            echo "Fast-forwarded Hugging Face main to GitHub commit $github_sha."
          else
            echo "::error::GitHub and Hugging Face main branches have diverged. Resolve the histories manually; no changes were pushed."
            exit 1
          fi
